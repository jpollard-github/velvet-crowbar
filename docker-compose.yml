services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: velvet_crowbar
      POSTGRES_USER: velvet_crowbar
      POSTGRES_PASSWORD: velvet_crowbar
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velvet_crowbar -d velvet_crowbar"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - velvet-crowbar-postgres:/var/lib/postgresql/data

volumes:
  velvet-crowbar-postgres:
